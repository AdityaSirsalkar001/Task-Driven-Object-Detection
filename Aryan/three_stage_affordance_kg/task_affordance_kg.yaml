        required: false
        candidate_groups:
        - affordance: serving_wine
          candidates: {wine_glass: 1.0, stemless_wine_glass: 0.94, champagne_flute: 0.88, wine_goblet: 0.84, decanter: 0.86, wine_carafe: 0.82, pitcher: 0.58, wine_bucket: 0.55}
        - affordance: holding_wine
          candidates: {wine_bottle: 0.96}
      instrument:
        required: false
        candidate_groups:
        - affordance: opening_wine
          candidates: {corkscrew: 1.0, waiters_corkscrew: 0.96, wing_corkscrew: 0.92, electric_wine_opener: 0.90, lever_corkscrew: 0.90}
        - affordance: pouring_wine
          candidates: {wine_pourer: 0.86, wine_aerator: 0.78}

scoring:
  principles:
  - Affordance/path validity is a hard semantic gate.
  - KG relevance is semantic suitability, not visual confidence.
  - Conditional metadata must remain visible for safety-sensitive candidates.
  - If no visually verified candidate survives, return no_suitable_object_detected.

expansion_rules:
  task_addition: Add task roles, sub-affordances, candidate priors, and precise aliases in this YAML.
  object_addition: Add an ObjectClass, categories, affordances, safety metadata, and detector aliases.
  detector_replacement: Change only the detector adapter, not the ontology.
  slm_replacement: Change only the canonical task parser, not object knowledge.
