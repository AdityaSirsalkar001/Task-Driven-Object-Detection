          candidates: {step_stool: 1.0, platform: 0.90, footstool: 0.82, work_platform: 0.94, doorstep: 0.68, curb: 0.55, low_bench: 0.54, wooden_pallet: 0.52}
        - affordance: climbing_steps
          candidates: {ladder: 0.94, stairs: 0.92}
