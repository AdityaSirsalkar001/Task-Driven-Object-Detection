          candidates: {stool: 0.70, chair: 0.38, wooden_crate: 0.64, sturdy_box: 0.58, concrete_block: 0.52, wooden_block: 0.45}

  wine:
    aliases: [wine, serve wine, drink wine, open wine, pour wine]
    semantic_note: Broad benchmark task; roles keep holding, opening, pouring, and serving concepts separate.
    roles:
