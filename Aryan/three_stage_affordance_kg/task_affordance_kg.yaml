tasks:
  dig_hole:
    aliases: [dig hole, dig a hole, make a hole in the ground]
    roles:
      instrument:
        required: true
        candidate_groups:
        - affordance: digging_soil
          candidates: {shovel: 1.0, spade: 0.98, digging_shovel: 0.98, garden_spade: 0.94, garden_trowel: 0.88, hand_trowel: 0.86, hoe: 0.82}
        - affordance: breaking_hard_ground
          candidates: {mattock: 0.92, pickaxe: 0.88, pick_mattock: 0.88, digging_bar: 0.82, crowbar: 0.55, garden_fork: 0.68}
        - affordance: boring_hole
          candidates: {post_hole_digger: 1.0, hand_auger: 0.96, earth_auger: 0.96}
        - affordance: trenching
          candidates: {trenching_shovel: 0.94}
        - affordance: scooping_soil
          candidates: {soil_scoop: 0.62}

  extinguish_fire:
    aliases: [extingh_fire, extinguish fire, put out fire, put out the fire]
    roles:
      target:
        required: false
        output: false
        candidates: {fire: 1.0}
      instrument:
        required: true
        candidate_groups:
        - affordance: extinguishing_directly
          candidates: {fire_extinguisher: 1.0, fire_suppression_canister: 0.90, aerosol_fire_extinguisher: 0.85}
        - affordance: smothering_fire
          candidates: {fire_blanket: 0.95}
        - affordance: delivering_water
          candidates: {fire_hose: 0.92, hose: 0.78, water_hose: 0.82, water_bucket: 0.82, water_container: 0.60, watering_can: 0.50}
        - affordance: carrying_suppressant
          candidates: {bucket: 0.72, pail: 0.68}
        - affordance: delivering_sand
          candidates: {sand_bucket: 0.88, sand_container: 0.78, bucket_of_sand: 0.88, fire_bucket: 0.90}
        - affordance: automatic_fire_suppression
          candidates: {fire_sprinkler: 0.90, sprinkler_head: 0.82, fire_hose_reel: 0.92}
    constraints:
    - Water-based suppression is fire-type dependent and must not be treated as universally safe.

  open_parcel:
    aliases: [open parcel, open package, open box, unpack parcel]
    roles:
      target:
        required: false
        output: false
        candidates: {parcel: 1.0}
      instrument:
        required: true
        candidate_groups:
        - affordance: cutting_packaging
          candidates: {box_cutter: 1.0, scissors: 0.92, safety_cutter: 0.94, craft_knife: 0.82, razor_blade: 0.66, knife: 0.72, pocket_knife: 0.70}
        - affordance: slicing_tape
          candidates: {letter_opener: 0.84, seam_ripper: 0.55}
        - affordance: opening_package
          candidates: {packaging_opener: 0.90, flathead_screwdriver: 0.48, pry_tool: 0.58}

  place_flowers:
    aliases: [place flower, place flowers, put flowers, keep flowers]
    roles:
      object:
        required: false
        candidates: {flower: 1.0}
      destination:
        required: true
        candidate_groups:
        - affordance: holding_flowers
          candidates: {flower_basket: 0.78, flower_bucket: 0.82}
        - affordance: containing_flower_stems
          candidates: {vase: 1.0, urn: 0.82}
        - affordance: supporting_plant
          candidates: {flower_pot: 0.94, plant_pot: 0.90, planter: 0.90, flower_planter: 0.92, decorative_pot: 0.88}
        - affordance: temporary_flower_container
          candidates: {jar: 0.82, mason_jar: 0.82, pitcher: 0.76, jug: 0.72, bottle_vase: 0.62, glass_bottle: 0.66, bucket: 0.70, basket: 0.65, watering_can: 0.55, cup: 0.45}

  pour_sugar:
