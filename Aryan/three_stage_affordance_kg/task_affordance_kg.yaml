kg_meta:
  name: TaskAffordanceKG
  version: 2.0.0
  purpose: Persistent task-conditioned object retrieval knowledge for Qwen -> KG -> Florence.
  design: Task -> Role -> Affordance -> ObjectClass -> DetectorAlias. This is not a scene graph.
  matching_policy:
    primary: deterministic graph traversal over task roles and affordances
    secondary: attributes and safety conditions are metadata, not vector-search inputs
    forbidden_fallback: never send raw task text to Florence when no KG candidates exist

relations:
  REQUIRES_ROLE: Task -> Role
  REQUIRES_AFFORDANCE: Role -> Affordance
  HAS_AFFORDANCE: ObjectClass/ObjectCategory -> Affordance
  VALID_FOR_ROLE: ObjectClass -> Role
  IS_A: ObjectClass/ObjectCategory -> ObjectCategory
  HAS_ATTRIBUTE: ObjectClass -> Attribute
  SYNONYM_OF: Alias -> canonical concept
  DETECTOR_ALIAS: ObjectClass -> textual detector label
  INCOMPATIBLE_WITH: ObjectClass/Affordance -> constraint
  OPTIONAL_CONTEXT: Task -> contextual object

roles: [target, instrument, material, destination, support, container, consumable, context, object]

affordances:
  digging_soil: {description: Excavates ordinary soil.}
  breaking_hard_ground: {description: Breaks compacted or rocky ground.}
  scooping_soil: {description: Scoops and removes loose soil.}
  boring_hole: {description: Bores a narrow or post-sized hole.}
  trenching: {description: Cuts a narrow trench.}
  extinguishing_directly: {description: Directly suppresses a fire with a purpose-built agent.}
  carrying_suppressant: {description: Carries water, sand, or another suppressant.}
  delivering_water: {description: Delivers water toward a fire; suitability depends on fire type.}
  delivering_sand: {description: Delivers sand for smothering a suitable fire.}
  smothering_fire: {description: Restricts oxygen reaching a fire.}
  automatic_fire_suppression: {description: Automatically releases a fire suppressant.}
  cutting_packaging: {description: Cuts cardboard, wrapping, or packaging.}
  slicing_tape: {description: Slices package tape or seals.}
  opening_package: {description: Opens packaging without requiring a cutting edge.}
  holding_flowers: {description: Holds a flower arrangement.}
  containing_flower_stems: {description: Contains and supports cut flower stems.}
  supporting_plant: {description: Supports a rooted flowering plant.}
  temporary_flower_container: {description: Temporarily contains cut flowers.}
  dispensing_granules: {description: Dispenses sugar or another granular food.}
  scooping_granules: {description: Scoops a measured or small quantity of sugar.}
  holding_sugar: {description: Holds sugar before transfer.}
  funneling_granules: {description: Guides sugar into a narrow opening.}
  supporting_seated_person: {description: Supports a person in a seated posture.}
  cushioned_seating: {description: Provides padded or soft seating.}
  reclining_support: {description: Supports a relaxed or reclined seated posture.}
  spreading_soft_food: {description: Spreads butter or another soft food.}
  brushing_soft_food: {description: Applies softened butter using bristles.}
  supporting_body_weight: {description: Supports a standing person's body weight.}
  elevated_step: {description: Provides a raised surface for stepping up.}
  climbing_steps: {description: Provides multiple successive steps.}
  holding_wine: {description: Contains wine for storage or serving.}
  opening_wine: {description: Removes a cork or wine-bottle closure.}
  pouring_wine: {description: Controls wine flow while pouring.}
  serving_wine: {description: Presents wine for drinking.}

